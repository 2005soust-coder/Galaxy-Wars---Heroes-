<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06142b"><title>Galaxy Wars - Heroes</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--cyan:#28dfff;--blue:#145bdb;--violet:#b72cff;--panel:rgba(4,10,25,.9);--line:rgba(42,204,255,.8)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#f4fbff;font-family:Arial,Helvetica,sans-serif}
body{background-image:linear-gradient(0deg,rgba(1,5,17,.84),rgba(1,5,17,.34)),url('assets/background.png');background-size:cover;background-position:center}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(135deg,#102d62,#11152b 58%,#32104e);border-radius:10px;padding:10px 16px;box-shadow:0 3px 14px #0009}button:disabled{opacity:.35;cursor:not-allowed}button:active{transform:scale(.98)}
.screen{position:absolute;inset:0;display:none;overflow:auto;padding:12px}.screen.active{display:flex;flex-direction:column}
#splash{align-items:center;justify-content:center;background:#030611 url('assets/logo.png') center 38%/min(92vw,900px) auto no-repeat}#splash:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(2,6,20,.8),transparent 60%)}#splash .splash-actions{z-index:1;margin-top:auto;margin-bottom:6vh}
.title{font-size:clamp(20px,3vw,34px);color:#dffaff;text-align:center;text-shadow:0 0 14px #00bfff,0 2px 4px #000}.sub{font-size:13px;color:#c8d8ee;text-align:center}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 25px #0009}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.player-choices button{min-width:50px;font-size:20px}.player-choices .active-choice{border:2px solid #f0aaff;background:linear-gradient(135deg,#174e8c,#641a8c);box-shadow:0 0 15px #a33dff}
#settings{gap:10px}.settings-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.settings-content{display:flex;gap:12px;min-height:0;flex:1}.settings-left{width:220px;display:flex;flex-direction:column;gap:10px;justify-content:center}
#heroPicker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;overflow:auto;padding:6px;flex:1;min-height:0}.pick{position:relative;border:2px solid #2565a9;border-radius:8px;overflow:hidden;background:#070b16;min-width:0;opacity:.5;padding:2px}.pick.selected{opacity:1;border-color:#31e4ff;box-shadow:0 0 12px #00cfff}.pick img{width:100%;height:100%;object-fit:contain;display:block;aspect-ratio:1089/1536;background:#030611}.pick .tick{position:absolute;right:4px;top:4px;background:#126f54;border:1px solid #aaffed;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font:bold 14px sans-serif}.pick:not(.selected) .tick{display:none}
#game{padding:7px;overflow:hidden;gap:7px}.game-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}.game-head strong{color:#9deeff;text-shadow:0 0 8px #007cff;font-size:clamp(12px,2vw,18px)}.game-head button{padding:7px 10px;font-size:12px}
#playerAreas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:none}.player-zone{background:rgba(3,9,23,.9);border:1px solid var(--line);border-radius:9px;padding:5px;display:flex;flex-direction:column;min-width:0;min-height:0}.player-zone h3{font-size:clamp(10px,1.7vw,15px);color:#b7f5ff;text-align:center;margin:2px 0 5px}.slots{display:flex;gap:4px;justify-content:center;align-items:center;min-height:0}.slot{width:48%;aspect-ratio:1089/1536;border:1px dashed #49b9e8;border-radius:5px;overflow:hidden;display:grid;place-items:center;color:#a4dcff;font-size:12px;background:#071124}.slot img{width:100%;height:100%;object-fit:contain;display:block;background:#030611}
#deckArea{display:flex;flex-direction:column;min-height:0;flex:1;background:rgba(2,6,18,.78);border:1px solid #2366bc;border-radius:12px;padding:6px}#deckTop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 7px}#turnInfo{text-align:center;color:#e4c4ff;font-size:clamp(12px,2vw,17px);font-weight:bold}#remaining{font-size:11px;color:#9ebcda;white-space:nowrap}#deck{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px;flex:1;min-height:0;overflow:auto;align-content:start}.deck-card{position:relative;min-width:0;min-height:0;border-radius:6px;overflow:hidden;border:1px solid #28cfff;background:#080d1d;padding:0;perspective:600px}.deck-card img{width:100%;height:100%;object-fit:contain;display:block;background:#030611}.deck-card .hint{position:absolute;inset:auto 0 0;background:#000b;text-align:center;font-size:10px;padding:3px}.deck-card.flipping{animation:flipcard .6s ease-in-out}@keyframes flipcard{0%{transform:rotateY(0)}45%{transform:rotateY(90deg) scale(.92)}55%{transform:rotateY(90deg) scale(.92)}100%{transform:rotateY(180deg)}}
#done{align-items:center;justify-content:center;gap:14px}#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(950px,100%);overflow:auto}.result-player{background:rgba(3,9,23,.92);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.result-player h3{margin:2px 0 7px;color:#b7f5ff}.result-cards{display:flex;gap:8px;justify-content:center}.result-cards img{height:clamp(105px,23vh,190px);max-width:48%;aspect-ratio:1089/1536;object-fit:contain;border-radius:5px;border:1px solid #3bdfff;background:#030611}
@media(orientation:portrait){#heroPicker{grid-template-columns:repeat(3,minmax(0,1fr))}.settings-content{flex-direction:column}.settings-left{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center}.settings-left>div{min-width:100%;text-align:center}.settings-left p{width:100%}#playerAreas{grid-template-columns:repeat(3,minmax(0,1fr))}.player-zone h3{font-size:11px}.slot{width:46%;max-height:78px}#deck{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(90px,1fr)}#deckTop{flex-wrap:wrap;justify-content:center}.game-head strong{font-size:11px}}
@media(max-width:390px) and (orientation:portrait){#deck{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(105px,1fr)}.screen{padding:6px}}
</style></head><body>
<section id="splash" class="screen active"><div class="splash-actions"><button id="startBtn" style="font-size:20px;padding:14px 32px">ZAČÍT HRU</button></div></section>
<section id="settings" class="screen"><div class="settings-head"><h1 class="title">GALAXY WARS – HEROES</h1><span id="selectedCount" class="sub">15 / 15 hrdinů vybráno</span></div><div class="settings-content"><div class="settings-left panel"><div><h3>POČET HRÁČŮ</h3><div class="row player-choices"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button></div></div><p class="sub">Každý hráč získá dvě různé karty.</p><button id="selectAll">VYBRAT VŠECHNY</button><button id="clearAll">ZRUŠIT VÝBĚR</button><button id="beginBtn">PŘIPRAVIT LOSOVÁNÍ</button><button id="backSplash">ZPĚT</button></div><div class="panel" style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0"><h2 class="sub">VYBER HRDINY, KTEŘÍ SE MOHOU LOSOVAT</h2><div id="heroPicker"></div></div></div></section>
<section id="game" class="screen"><div class="game-head"><strong>GALAXY WARS • LOSOVÁNÍ HRDINŮ</strong><span id="progress" class="sub"></span><button id="quitGame">ZRUŠIT HRU</button></div><div id="playerAreas"><div class="player-zone" id="zone0"><h3>HRÁČ 1</h3><div class="slots"><div class="slot"><span>1</span></div><div class="slot"><span>2</span></div></div></div><div class="player-zone" id="zone1"><h3>HRÁČ 2</h3><div class="slots"><div class="slot"><span>1</span></div><div class="slot"><span>2</span></div></div></div><div class="player-zone" id="zone2"><h3>HRÁČ 3</h3><div class="slots"><div class="slot"><span>1</span></div><div class="slot"><span>2</span></div></div></div><div class="player-zone" id="zone3"><h3>HRÁČ 4</h3><div class="slots"><div class="slot"><span>1</span></div><div class="slot"><span>2</span></div></div></div><div class="player-zone" id="zone4"><h3>HRÁČ 5</h3><div class="slots"><div class="slot"><span>1</span></div><div class="slot"><span>2</span></div></div></div></div><div id="deckArea"><div id="deckTop"><div id="turnInfo">HRÁČ 1 – VYBER KARTU</div><span id="remaining"></span></div><div id="deck"></div></div></section>
<section id="done" class="screen"><h1 class="title">VÝBĚR DOKONČEN</h1><p class="sub">Každý hráč má své dva hrdiny.</p><div id="results"></div><div class="row"><button id="newGame">NOVÁ HRA</button><button id="homeBtn">HLAVNÍ MENU</button></div></section><script src="app.js"></script></body></html>
